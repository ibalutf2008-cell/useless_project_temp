<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trivia Trapdoor — play a game, unlock a fact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- decorative doodles, purely visual -->
  <svg class="doodle doodle-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 8.1H23l-6.9 5 2.6 8.1L12 16.2 5.3 21.2l2.6-8.1L1 8.1h8.4z"/></svg>
  <svg class="doodle doodle-squiggle" viewBox="0 0 100 20" aria-hidden="true"><path d="M2 10 Q 15 0, 28 10 T 54 10 T 80 10 T 106 10" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
  <svg class="doodle doodle-blob" viewBox="0 0 200 200" aria-hidden="true"><path d="M45,-58C59,-49,71,-35,75,-19C79,-3,75,15,66,30C57,45,43,57,26,64C9,71,-11,73,-29,67C-47,61,-62,47,-70,29C-78,11,-79,-11,-71,-29C-63,-47,-46,-61,-28,-68C-10,-75,10,-75,27,-68C27,-68,31,-67,45,-58Z" /></svg>
  <svg class="doodle doodle-sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 3.4 1.6 4.4 5 5-3.4.6-4.4 1.6-5 5-.6-3.4-1.6-4.4-5-5 3.4-.6 4.4-1.6 5-5z"/></svg>
  <svg class="doodle doodle-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2 5 5.5 5c2 0 3.4 1 4.5 2.6C11.1 6 12.5 5 14.5 5 18 5 19.6 8.4 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
  <svg class="doodle doodle-swirl" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 5c14 0 25 9 25 22s-9 20-20 20-16-7-16-15 6-13 14-13 11 5 11 10-4 8-9 8" stroke-width="4" fill="none" stroke-linecap="round"/></svg>

  <div class="wrap">

    <!-- ============ HOME VIEW ============ -->
    <section id="homeView" class="view">
      <header class="hero">
        <p class="kicker">a small game before every fact</p>
        <h1 class="hero-title">Trivia<br><span class="rainbow-word"><span>T</span><span>r</span><span>a</span><span>p</span><span>d</span><span>o</span><span>o</span><span>r</span></span></h1>
        <p class="hero-sub">Pick a topic below, play a quick round, and the fact drops through the trapdoor when you win. Eight topics, eight tiny games — none of them take longer than your coffee.</p>
      </header>

      <div id="factGrid" class="fact-grid" role="list"></div>

      <footer class="site-footer">
        <p>Made for curious minds who hate boring trivia lists.</p>
      </footer>
    </section>

    <!-- ============ GAME VIEW ============ -->
    <section id="gameView" class="view hidden">
      <button id="backBtn" class="back-btn" type="button">&larr; back to topics</button>

      <div id="gamePanel" class="game-panel">
        <div class="game-panel-head">
          <span id="gameEmoji" class="game-emoji"></span>
          <div>
            <h2 id="gameTitle"></h2>
            <p id="gameInstructions" class="game-instructions"></p>
          </div>
        </div>

        <div id="gameArea" class="game-area"></div>

        <p id="gameStatus" class="game-status" aria-live="polite"></p>
      </div>

      <div id="factReveal" class="fact-reveal hidden">
        <div class="fact-reveal-card">
          <div class="fact-note">
            <p class="fact-reveal-label">trapdoor opened</p>
            <p id="factText" class="fact-text"></p>
          </div>
          <button id="nextFactBtn" class="next-btn" type="button">back to topics &rarr;</button>
        </div>
      </div>
    </section>

  </div>

<script src="script.js"></script>
</body>
</html>
